# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Re-center wallpaper on monitor hotplug (see scripts/respawn-swaybg-on-hotplug.sh)
exec-once = ~/.config/hypr/scripts/respawn-swaybg-on-hotplug.sh

# Auto power profile: performance on AC, power-saver on battery (follows plug/unplug)
exec-once = ~/.config/hypr/scripts/auto-power-profile.sh

# Session apps. Which workspace each lands on is set in workspaces.conf, not
# here -- these lines only decide *what* starts.
#
# mattermost-desktop is deliberately absent: it already starts from
# ~/.config/autostart/mattermost-desktop.desktop, and listing it again would
# launch it twice. It still gets pinned to workspace 1 by workspaces.conf.
exec-once = uwsm-app -- signal-desktop
exec-once = uwsm-app -- chromium --profile-directory="Profile 1"
exec-once = uwsm-app -- emacs
exec-once = uwsm-app -- claude-desktop
