# Pin apps to workspaces.
#
# Hyprland 0.53+ rule syntax (`match:` selectors) -- see
# ~/.local/share/omarchy/default/hypr/windows.conf for the reference style.
#
# `silent` places the window on its workspace WITHOUT switching the active
# workspace to follow it. That matters at login, when everything below opens
# at once: without it the focus would jump 1 -> 2 -> 3 as each app appears,
# and whichever started last would win.
#
# Note these rules are not login-specific -- they apply to every launch, so
# opening any of these apps later also sends it to its assigned workspace.

# Workspace 1: chat
windowrule = workspace 1 silent, match:class ^(signal)$
windowrule = workspace 1 silent, match:class ^(mattermost-desktop)$

# Workspace 2: browser.
# Anchored deliberately: Omarchy web apps are Chromium too, but run under
# classes like `chrome-<site>-Profile_1`. They should stay wherever they are
# launched, so only the bare browser matches here.
windowrule = workspace 2 silent, match:class ^(chromium)$

# Workspace 3: editor
windowrule = workspace 3 silent, match:class ^(Emacs)$

# Workspace 4: Claude desktop app (SUPER SHIFT C also launches/focuses it)
windowrule = workspace 4 silent, match:class ^(claude-desktop)$
